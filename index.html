<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <title>🫦</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --md-ref-palette-primary0: #000000;
        --md-ref-palette-primary10: #21005e;
        --md-ref-palette-primary20: #381e72;
        --md-ref-palette-primary30: #4f378a;
        --md-ref-palette-primary40: #6750a4;
        --md-ref-palette-primary50: #7f67be;
        --md-ref-palette-primary60: #9a82db;
        --md-ref-palette-primary70: #b69dff;
        --md-ref-palette-primary80: #d0bcff;
        --md-ref-palette-primary90: #eaddff;
        --md-ref-palette-primary95: #f6edff;
        --md-ref-palette-primary99: #fffbfe;
        --md-ref-palette-primary100: #ffffff;
        --md-ref-palette-surface0: #000000;
        --md-ref-palette-surface10: #1c1b1f;
        --md-ref-palette-surface20: #313033;
        --md-ref-palette-surface30: #48464a;
        --md-ref-palette-surface40: #605d62;
        --md-ref-palette-surface50: #79767a;
        --md-ref-palette-surface60: #938f94;
        --md-ref-palette-surface70: #aea9af;
        --md-ref-palette-surface80: #cac5ca;
        --md-ref-palette-surface90: #e6e1e6;
        --md-ref-palette-surface95: #f5eff4;
        --md-ref-palette-surface99: #fffbfe;
        --md-ref-palette-surface100: #ffffff;
        --md-sys-color-primary: var(--md-ref-palette-primary40);
        --md-sys-color-on-primary: var(--md-ref-palette-primary100);
        --md-sys-color-primary-container: var(--md-ref-palette-primary90);
        --md-sys-color-on-primary-container: var(--md-ref-palette-primary10);
        --md-sys-color-secondary: #625b71;
        --md-sys-color-on-secondary: #ffffff;
        --md-sys-color-secondary-container: #e8def8;
        --md-sys-color-on-secondary-container: #1d192b;
        --md-sys-color-surface: var(--md-ref-palette-surface99);
        --md-sys-color-surface-variant: var(--md-ref-palette-surface90);
        --md-sys-color-on-surface: var(--md-ref-palette-surface10);
        --md-sys-color-on-surface-variant: var(--md-ref-palette-surface30);
        --md-sys-color-outline: var(--md-ref-palette-surface50);
        --md-sys-color-error: #ba1a1a;
        --md-sys-color-on-error: #ffffff;
        --md-elevation-1:
          0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px 1px rgba(0, 0, 0, 0.05);
        --md-elevation-2:
          0 1px 2px 0 rgba(0, 0, 0, 0.08), 0 2px 6px 2px rgba(0, 0, 0, 0.05);
        --md-elevation-3:
          0 4px 8px 3px rgba(0, 0, 0, 0.05), 0 1px 3px 0 rgba(0, 0, 0, 0.08);
        --transition-default: all 0.2s cubic-bezier(0.2, 0, 0, 1);
      }

      body.dark {
        --md-sys-color-primary: var(--md-ref-palette-primary80);
        --md-sys-color-on-primary: var(--md-ref-palette-primary20);
        --md-sys-color-primary-container: var(--md-ref-palette-primary30);
        --md-sys-color-on-primary-container: var(--md-ref-palette-primary90);
        --md-sys-color-secondary: #ccc2dc;
        --md-sys-color-on-secondary: #332d41;
        --md-sys-color-secondary-container: #4a4458;
        --md-sys-color-on-secondary-container: #e8def8;
        --md-sys-color-surface: var(--md-ref-palette-surface10);
        --md-sys-color-surface-variant: var(--md-ref-palette-surface30);
        --md-sys-color-on-surface: var(--md-ref-palette-surface90);
        --md-sys-color-on-surface-variant: var(--md-ref-palette-surface80);
        --md-sys-color-outline: var(--md-ref-palette-surface60);
        --md-sys-color-error: #cf6679;
        --md-sys-color-on-error: #140c0e;
      }

      body {
        font-family:
          "Google Sans",
          "Inter",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          sans-serif;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        transition: background-color 0.3s var(--transition-default);
      }

      /* PIN MODAL */
      .pin-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 1rem;
        animation: fadeIn 0.3s var(--transition-default);
      }

      .pin-card {
        background: var(--md-sys-color-surface);
        border-radius: 32px;
        max-width: 360px;
        width: 100%;
        padding: 2rem 1.5rem 2rem;
        box-shadow: var(--md-elevation-3);
        text-align: center;
        animation: slideUp 0.25s var(--transition-default);
      }

      .pin-card input {
        width: 100%;
        padding: 1rem 1rem;
        font-size: 1.2rem;
        text-align: center;
        background: var(--md-sys-color-surface-variant);
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 28px;
        color: var(--md-sys-color-on-surface);
        margin: 1.2rem 0;
        transition: var(--transition-default);
      }

      .pin-card input:focus {
        outline: none;
        border-color: var(--md-sys-color-primary);
        box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.2);
      }

      .pin-card button {
        background: var(--md-sys-color-primary);
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 40px;
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: 0.5px;
        color: var(--md-sys-color-on-primary);
        cursor: pointer;
        width: 100%;
        transition: var(--transition-default);
      }

      .pin-card button:hover {
        filter: brightness(1.02);
        transform: translateY(-1px);
        box-shadow: var(--md-elevation-2);
      }

      .error-msg {
        color: var(--md-sys-color-error);
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }

      /* MAIN APP */
      .main-app {
        display: none;
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem 1.5rem 2rem;
        animation: fadeInUp 0.4s var(--transition-default);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .app-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
        padding-bottom: 0.5rem;
      }

      .logo h1 {
        font-size: 1.8rem;
        font-weight: 500;
        background: linear-gradient(
          135deg,
          var(--md-sys-color-primary),
          #c58af9
        );
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: -0.25px;
      }

      .header-actions {
        display: flex;
        gap: 0.6rem;
      }

      .icon-btn {
        background: var(--md-sys-color-surface-variant);
        border: none;
        padding: 0.5rem 1rem;
        border-radius: 28px;
        cursor: pointer;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--md-sys-color-on-surface);
        transition: var(--transition-default);
      }

      .icon-btn:hover {
        background: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        transform: scale(0.96);
      }

      /* Cards */
      .card {
        background: var(--md-sys-color-surface);
        border-radius: 32px;
        padding: 1.5rem;
        margin-bottom: 1.8rem;
        box-shadow: var(--md-elevation-1);
        transition: var(--transition-default);
        border: 1px solid var(--md-sys-color-outline);
      }

      .card:hover {
        box-shadow: var(--md-elevation-2);
      }

      .card-title {
        font-size: 1.3rem;
        font-weight: 500;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-left: 0.5rem;
        border-left: 5px solid var(--md-sys-color-primary);
      }

      .flex-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        margin-bottom: 1rem;
      }

      .input-group {
        flex: 1;
        min-width: 200px;
      }

      .input-group label {
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin-bottom: 0.3rem;
        color: var(--md-sys-color-on-surface-variant);
      }

      input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: var(--md-sys-color-surface-variant);
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 28px;
        color: var(--md-sys-color-on-surface);
        font-size: 0.95rem;
        transition: var(--transition-default);
      }

      input:focus {
        outline: none;
        border-color: var(--md-sys-color-primary);
        box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.2);
      }

      /* Preset chips */
      .presets-area {
        background: var(--md-sys-color-surface-variant);
        border-radius: 24px;
        padding: 1rem;
        margin-top: 0.5rem;
      }

      .presets-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 0.8rem;
      }

      .preset-check-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--md-sys-color-surface);
        padding: 0.4rem 1rem;
        border-radius: 40px;
        box-shadow: var(--md-elevation-1);
        transition: all 0.15s;
        cursor: pointer;
        border: 1px solid var(--md-sys-color-outline);
      }

      .preset-check-item:hover {
        transform: translateY(-2px);
        background: var(--md-sys-color-primary-container);
        border-color: var(--md-sys-color-primary);
      }

      .preset-check-item input {
        width: 18px;
        height: 18px;
        accent-color: var(--md-sys-color-primary);
        margin: 0;
        cursor: pointer;
      }

      .preset-manager {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.8rem;
      }

      .small-btn {
        background: var(--md-sys-color-surface);
        border: 1px solid var(--md-sys-color-outline);
        padding: 0.3rem 1rem;
        border-radius: 32px;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        color: var(--md-sys-color-on-surface);
        transition: var(--transition-default);
      }

      .small-btn:hover {
        background: var(--md-sys-color-primary-container);
        border-color: var(--md-sys-color-primary);
        transform: translateY(-1px);
      }

      /* Scrollable lists */
      .urls-section {
        margin: 1rem 0;
        max-height: 360px;
        overflow-y: auto;
        padding-right: 0.5rem;
      }

      .urls-section::-webkit-scrollbar {
        width: 6px;
      }

      .urls-section::-webkit-scrollbar-track {
        background: var(--md-sys-color-surface-variant);
        border-radius: 10px;
      }

      .urls-section::-webkit-scrollbar-thumb {
        background: var(--md-sys-color-primary);
        border-radius: 10px;
      }

      .select-all-bar {
        display: flex;
        justify-content: flex-end;
        gap: 0.8rem;
        margin-bottom: 0.8rem;
      }

      .select-all-btn {
        background: var(--md-sys-color-surface);
        border: 1px solid var(--md-sys-color-outline);
        padding: 0.3rem 1rem;
        border-radius: 32px;
        font-size: 0.75rem;
        font-weight: 500;
        cursor: pointer;
        color: var(--md-sys-color-on-surface);
        transition: var(--transition-default);
      }

      .select-all-btn:hover {
        background: var(--md-sys-color-primary-container);
        border-color: var(--md-sys-color-primary);
      }

      .url-check-item {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.7rem 1rem;
        background: var(--md-sys-color-surface-variant);
        border-radius: 48px;
        margin-bottom: 0.6rem;
        transition: all 0.2s;
        border: 1px solid var(--md-sys-color-outline);
      }

      .url-check-item:hover {
        border-color: var(--md-sys-color-primary);
        transform: translateX(4px);
        background: var(--md-sys-color-surface);
      }

      .url-check-item input {
        width: 1.2rem;
        height: 1.2rem;
        accent-color: var(--md-sys-color-primary);
      }

      .portal-label {
        font-weight: 500;
        font-size: 0.95rem;
        flex: 1;
      }

      .action-buttons {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }

      .btn-open {
        background: var(--md-sys-color-primary);
        border: none;
        padding: 0.7rem 1.8rem;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.95rem;
        letter-spacing: 0.5px;
        color: var(--md-sys-color-on-primary);
        cursor: pointer;
        transition: var(--transition-default);
        box-shadow: var(--md-elevation-1);
      }

      .btn-open:hover {
        transform: translateY(-2px);
        box-shadow: var(--md-elevation-2);
        filter: brightness(1.02);
      }

      footer {
        text-align: center;
        font-size: 0.7rem;
        margin-top: 2rem;
        color: var(--md-sys-color-on-surface-variant);
        opacity: 0.8;
      }
    </style>
  </head>

      // Helper: format value
      function formatValue(rawValue, formatType) {
        let trimmed = rawValue
          .trim()
          .toLowerCase()
          .replace(/[-_/\\%]+/g, " ") // convert separators to spaces
          .replace(/[^\w\s]/g, "") // remove remaining special chars
          .replace(/\s+/g, " ") // collapse multiple spaces
          .trim();
        if (trimmed === "") return "";
        switch (formatType) {
          case "hyphen":
            return trimmed.replace(/\s+/g, "-");
          case "plus":
            return trimmed.replace(/\s+/g, "+");
          case "percent20":
            return trimmed.replace(/\s+/g, "%20");
          default:
            return trimmed.replace(/\s+/g, "-");
        }
      }

      function getActiveValues() {
        const nameValue = nameInput.value.trim();
        if (nameValue !== "")
          return [
            {
              source: "name",
              value: nameValue,
            },
          ];
        const selected = Array.from(selectedPresets);
        if (selected.length === 0) return [];
        return selected.map((p) => ({
          source: "preset",
          value: p,
        }));
      }
      // Render premium list with checkboxes based on defaultSelected

      // ========== PRESET CHECKBOX LOGIC ==========
      function renderPresetCheckboxes() {
        presetsChecklistDiv.innerHTML = "";
        presetList.forEach((preset) => {
          const div = document.createElement("div");
          div.className = "preset-check-item";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.value = preset;
          cb.checked = selectedPresets.has(preset);
          cb.addEventListener("change", (e) => {
            // selecting preset clears name input
            if (e.target.checked) {
              nameInput.value = "";
              selectedPresets.add(preset);
            } else {
              selectedPresets.delete(preset);
            }

            savePresetsSelection();
          });
          const label = document.createElement("span");
          label.textContent = preset;
          div.appendChild(cb);
          div.appendChild(label);
          presetsChecklistDiv.appendChild(div);
        });
      }

      function savePresets() {
        localStorage.setItem("portal_presets_list", JSON.stringify(presetList));
        savePresetsSelection();
      }

      function savePresetsSelection() {
        localStorage.setItem(
          "portal_selected_presets",
          JSON.stringify(Array.from(selectedPresets)),
        );
      }

      function loadPresets() {
        const storedList = localStorage.getItem("portal_presets_list");
        if (storedList) {
          const parsed = JSON.parse(storedList);
          if (Array.isArray(parsed) && parsed.length) presetList = parsed;
          else presetList = presetList;
        } else presetList = presetList;
        selectedPresets.clear();
        savePresetsSelection();
        renderPresetCheckboxes();
      }

      function addPreset() {
        let newPreset = prompt("Enter new preset:");
        if (newPreset && newPreset.trim()) {
          newPreset = newPreset.trim().toLowerCase(); // <-- add .toLowerCase()
          if (!presetList.includes(newPreset)) {
            presetList.push(newPreset);
            selectedPresets.add(newPreset);
            savePresets();
            renderPresetCheckboxes();
          } else alert("Preset exists.");
        }
      }

      function removeSelectedPresets() {
        const toRemove = Array.from(selectedPresets);

        if (toRemove.length === 0) {
          alert("No presets selected.");
          return;

        toRemove.forEach((p) => {
          const idx = presetList.indexOf(p);

          if (idx !== -1) {
            presetList.splice(idx, 1);
          }

          selectedPresets.delete(p);
        });

        savePresets();

        renderPresetCheckboxes();
      }

      // Open URLs
      function openUrlsForValue(
        activeValue,
        urlsArray,
        checkboxSelector,
        categoryType,
      ) {
        const checkboxes = document.querySelectorAll(checkboxSelector);

        const selected = [];

        checkboxes.forEach((cb, idx) => {
          if (cb.checked) selected.push(idx);
        });

        if (selected.length === 0) return false;

        for (let idx of selected) {
          const entry = urlsArray[idx];

          if (!entry) continue;

          // =========================
          // DEFAULT URL
          // =========================

          if (!activeValue) {
            if (entry.default) {
              window.open(entry.default, "_blank");
            }

            continue;
          }

          const formatted = formatValue(activeValue.value, entry.format);

          // =========================
          // PREMIUM PORTALS
          // =========================

          if (categoryType === "premium") {
            let template = null;

            if (activeValue.source === "name") {
              template = entry.model;
            } else if (activeValue.source === "preset") {
              template = entry.preset;
            }

            if (!template) continue;

            const url = template.replace(/\{value\}/g, formatted);

            window.open(url, "_blank");
          }

          // =========================
          // OTHER SITES
          // =========================

          if (categoryType === "other") {
            // preset selected
            if (activeValue.source === "preset") {
              if (!entry.preset) continue;

              const url = entry.preset.replace(/\{value\}/g, formatted);

              window.open(url, "_blank");

              continue;
            }

            // name entered
            if (activeValue.source === "name") {
              Object.keys(entry).forEach((key) => {
                if (!/^\d+$/.test(key)) return;

                const template = entry[key];

                if (!template) return;

                const url = template.replace(/\{value\}/g, formatted);

                window.open(url, "_blank");
              });
            }
          }
        }

        return true;
      }

      function openSelectedUrlsWithMultiPreset(
        urlsArray,
        checkboxSelector,
        categoryName,
        categoryType,
      ) {
        const values = getActiveValues();

        const anyChecked = Array.from(
          document.querySelectorAll(checkboxSelector),
        ).some((cb) => cb.checked);

        if (!anyChecked) {
          alert(`No ${categoryName} selected.`);
          return false;
        }

        // =========================
        // NOTHING SELECTED
        // =========================

        if (values.length === 0) {
          if (!confirm(`Open default ${categoryName} URLs?`)) {
            return false;
          }

          openUrlsForValue(null, urlsArray, checkboxSelector, categoryType);

          return true;
        }

        // =========================
        // NORMAL FLOW
        // =========================

        let msg = `Open ${categoryName} for: `;

        if (values.length === 1) {
          msg += `"${values[0].value}"`;
        } else {
          msg += `${values.length} presets`;
        }

        if (!confirm(msg + " ?")) return false;

        for (let val of values) {
          openUrlsForValue(val, urlsArray, checkboxSelector, categoryType);
        }

        return true;
      }
      // Dark mode
      function initDarkMode() {
        const stored = localStorage.getItem("theme");
        if (stored === "dark") document.body.classList.add("dark");
        else if (stored === "light") document.body.classList.remove("dark");
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
          document.body.classList.add("dark");
      }

      function toggleDarkMode() {
        document.body.classList.toggle("dark");
        localStorage.setItem(
          "theme",
          document.body.classList.contains("dark") ? "dark" : "light",
        );

        sessionStorage.removeItem("portal_unlocked");

        } else pinErrorSpan.innerText = "❌ Incorrect PIN.";
